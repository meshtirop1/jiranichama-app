name: jirani_ui
description: JiraniChama design system. Theme tokens and shared widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  jirani_domain:
    path: ../jirani_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Regular.ttf
        - asset: fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
