name: jirani_secure_keys
description: "Signing keys in the phone's secure chip, used after a fingerprint, face or PIN."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ke.co.jiranichama.securekeys
        pluginClass: SecureKeysPlugin
