name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Domain package (pure Dart, shared hash vectors)
        working-directory: packages/jirani_domain
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Design system package
        working-directory: packages/jirani_ui
        run: |
          flutter pub get
          flutter test
      - name: App
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --fatal-infos
          flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Debug APK builds
        run: flutter build apk --debug --dart-define=FLAVOR=dev
